name: Build Bangladesh Village Database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-village-database.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified Bangladesh location release
        run: |
          curl -L --fail --retry 3 -o /tmp/address-bd-data.tar.zst \
            "https://github.com/montasim/bangladesh-location-registry/releases/download/data-2026.08.04/address-bd-data-2026.08.04-json.tar.zst"
          echo "9b76179403d735231604aa460031b29b1a60123112f6ea5b27996269c1cd604c  /tmp/address-bd-data.tar.zst" | sha256sum -c -

      - name: Build flat village database with parent names
        run: |
          rm -rf /tmp/location-db
          mkdir -p /tmp/location-db
          tar --use-compress-program=unzstd -xf /tmp/address-bd-data.tar.zst -C /tmp/location-db

          python - <<'PY'
          import json, pathlib, gzip

          root=pathlib.Path("/tmp/location-db")
          entities={}
          for p in root.rglob("*.json"):
              try:
                  d=json.load(open(p,encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(d,dict) or "entityType" not in d or "records" not in d:
                  continue
              entities[d["entityType"]]=d["records"]

          def idx(kind):
              return {r.get("key"):r for r in entities.get(kind,[]) if r.get("key")}

          div=idx("division"); zil=idx("zilla"); upz=idx("upazila"); uni=idx("union")
          villages=entities.get("village",[])
          assert len(villages)==90049, len(villages)

          def name(r):
              n=(r or {}).get("name") or {}
              return (n.get("bn") or n.get("en") or "").strip()

          out=[]
          for v in villages:
              rel=v.get("relations") or {}
              uk=rel.get("localArea",{}).get("key") or rel.get("unionKey")
              upk=rel.get("administrativeArea",{}).get("key") or rel.get("upazilaKey")
              dk=rel.get("divisionKey")
              zk=rel.get("zillaKey")
              ur=uni.get(uk,{})
              upr=upz.get(upk,{})
              dr=div.get(dk,{})
              zr=zil.get(zk,{})
              out.append({
                  "division":name(dr),
                  "district":name(zr),
                  "upazila":name(upr),
                  "union":name(ur),
                  "village":name(v)
              })

          out=[r for r in out if r["village"]]
          assert len(out)==90049, len(out)

          payload={"version":"2026.08.04","recordCount":len(out),"records":out}
          raw=json.dumps(payload,ensure_ascii=False,separators=(",",":")).encode("utf-8")
          open("VillageDatabase-2026.08.04.json","wb").write(raw)
          with gzip.open("VillageDatabase-2026.08.04.json.gz","wb",compresslevel=9) as f:
              f.write(raw)
          print("Village records:",len(out))
          PY

          rm VillageDatabase-2026.08.04.json

      - name: Commit village database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VillageDatabase-2026.08.04.json.gz
          git diff --cached --quiet && exit 0
          git commit -m "Add Bangladesh village database 2026.08.04"
          git push
